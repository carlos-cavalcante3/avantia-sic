name: RD Station CRM ETL

on:
  schedule:
    # Ajuste a frequência conforme o volume de dados e o rate limit da RD Station.
    # Exemplo: a cada 3 horas.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}   # permite disparo manual pela interface do GitHub

# Impede que duas execuções rodem em paralelo (agendada + manual, por exemplo).
# 'cancel-in-progress: false' faz o GitHub ENFILEIRAR a nova execução em vez
# de cancelar a que já está rodando — evita que uma renovação de token seja
# interrompida no meio. Isso é uma segunda camada de proteção, além do lock
# distribuído já implementado no Supabase (silver.api_auth.renovando).
concurrency:
  group: rd-station-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # Limite de tempo explícito: se o job travar (ex: loop de paginação),
    # falha de forma visível em vez de consumir o orçamento de minutos
    # do GitHub Actions silenciosamente.
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar pipeline RD Station → Supabase
        env:
          RD_CLIENT_ID: ${{ secrets.RD_CLIENT_ID }}
          RD_CLIENT_SECRET: ${{ secrets.RD_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python run.py
