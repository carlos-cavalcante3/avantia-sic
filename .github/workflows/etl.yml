name: RD Station CRM ETL

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch: {}

concurrency:
  group: rd-station-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar pipeline RD Station → Supabase
        env:
          RD_CLIENT_ID: ${{ secrets.RD_CLIENT_ID }}
          RD_CLIENT_SECRET: ${{ secrets.RD_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python run.py

      - name: Registrar execução do ETL
        if: success()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          psql "$SUPABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO privado.etl_sync_log (status) VALUES ('sucesso');"
